name: publicar painel
on:
  push:
    branches: [main]
    paths: ['dados/painel.enc', '.github/workflows/publicar.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q cryptography
      - name: chave publica e painel
        env:
          PAINEL_SENHA: ${{ secrets.SENHA_CADERNO || secrets.PAINEL_SENHA }}
        run: |
          set -e
          [ -n "$PAINEL_SENHA" ] || { echo "falta o secret SENHA_CADERNO"; exit 1; }
          T=$(mktemp -d); printf '%s' "$PAINEL_SENHA" > "$T/pw"
          python3 tools/confere.py "$T/pw" index.html || { rm -rf "$T"; exit 3; }
          python3 tools/nuvem.py pub "$T/pw" tools/nuvem.pub
          if [ -f dados/painel.enc ] && python3 tools/nuvem.py dec "$T/pw" dados/painel.enc "$T/p.html"; then
            python3 tools/encrypt.py "$T/p.html" "$T/pw" index.html > /dev/null
          fi
          rm -rf "$T"
      - name: commit
        run: |
          git config user.name Suetam016; git config user.email Suetam016@users.noreply.github.com
          git add index.html tools/nuvem.pub
          git diff --cached --quiet || { git commit -qm "atualiza (nuvem)"; git push -q; }
      - name: rebuild pages
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
